# ══════════════════════════════════════════════
#  JobTracker  —  config.ini
#  Copy this to config.ini and fill in your values
# ══════════════════════════════════════════════

[tracker]
# How often to check career pages (minutes)
poll_interval_minutes = 30

# Jobs requiring UP TO this many years will trigger an alert (set 3 for ≤3 yrs)
max_experience_years = 4

# Polite delay between requests to the same site (seconds)
delay_between_requests = 2


# ──────────────────────────────────────────────
#  AI Provider — choose: claude | grok | both
#
#  claude → uses Anthropic Claude Haiku (fast, cheap ~$0.001/job)
#  grok   → uses xAI Grok-3-mini (FREE tier available!)
#  both   → tries Claude first, falls back to Grok
#
#  If both keys are blank, uses regex-based extraction (no API needed).
# ──────────────────────────────────────────────
[ai]
provider = grok

# Get your Anthropic key at: https://console.anthropic.com
claude_api_key = 

# Get your free xAI/Grok key at: https://console.x.ai
grok_api_key = xai-YOURKEY_HERE


# ──────────────────────────────────────────────
#  Email notifications  (optional but recommended)
#  Works with Gmail, Outlook, or any SMTP server
# ──────────────────────────────────────────────
[email]
smtp_host     = smtp.gmail.com
smtp_port     = 587
smtp_user     = your.email@gmail.com
smtp_password = your_app_password_here
# Who to notify (can be same as smtp_user)
to_address    = your.email@gmail.com

# Gmail users: use an App Password, NOT your normal password.
# Enable at: https://myaccount.google.com/apppasswords
# (You need 2FA enabled first)
